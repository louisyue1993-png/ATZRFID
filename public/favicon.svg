<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background (rounded square) -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="white"/>

  <!-- RFID Chip Icon - Centered and sized for favicon -->
  <g transform="translate(4, 4)">
    <!-- Base chip -->
    <rect x="0" y="0" width="24" height="24" rx="4" fill="url(#iconGradient)"/>

    <!-- Inner chip details -->
    <rect x="4" y="4" width="5" height="5" rx="1" fill="#3B82F6" opacity="0.6"/>
    <rect x="15" y="4" width="5" height="5" rx="1" fill="#3B82F6" opacity="0.6"/>
    <rect x="4" y="15" width="5" height="5" rx="1" fill="#3B82F6" opacity="0.6"/>
    <rect x="15" y="15" width="5" height="5" rx="1" fill="#3B82F6" opacity="0.6"/>

    <!-- Center dot -->
    <circle cx="12" cy="12" r="4" fill="#F59E0B"/>
    <circle cx="12" cy="12" r="2" fill="#1E3A8A"/>
  </g>
</svg>