<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="white"/>

  <!-- RFID Chip Icon - Centered -->
  <g transform="translate(80, 80)">
    <!-- Base chip -->
    <rect x="0" y="0" width="352" height="352" rx="56" fill="url(#iconGradient)"/>

    <!-- Inner chip details -->
    <rect x="56" y="56" width="72" height="72" rx="16" fill="#3B82F6" opacity="0.6"/>
    <rect x="224" y="56" width="72" height="72" rx="16" fill="#3B82F6" opacity="0.6"/>
    <rect x="56" y="224" width="72" height="72" rx="16" fill="#3B82F6" opacity="0.6"/>
    <rect x="224" y="224" width="72" height="72" rx="16" fill="#3B82F6" opacity="0.6"/>

    <!-- Center dot -->
    <circle cx="176" cy="176" r="64" fill="#F59E0B"/>
    <circle cx="176" cy="176" r="32" fill="#1E3A8A"/>

    <!-- Signal waves (RFID radio waves) -->
    <path d="M 384 140 Q 416 176 384 212" stroke="#3B82F6" stroke-width="12" fill="none" opacity="0.8"/>
    <path d="M 400 120 Q 448 176 400 232" stroke="#3B82F6" stroke-width="12" fill="none" opacity="0.6"/>
    <path d="M 416 100 Q 480 176 416 252" stroke="#3B82F6" stroke-width="12" fill="none" opacity="0.4"/>
  </g>
</svg>