<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <!-- Gradient for the icon -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background (optional, remove if transparent is needed) -->
  <rect width="300" height="80" rx="8" fill="white" opacity="0"/>
  
  <!-- RFID Chip Icon -->
  <g filter="url(#shadow)">
    <!-- Base chip -->
    <rect x="10" y="15" width="50" height="50" rx="8" fill="url(#iconGradient)"/>
    
    <!-- Inner chip details -->
    <rect x="18" y="23" width="10" height="10" rx="2" fill="#3B82F6" opacity="0.6"/>
    <rect x="42" y="23" width="10" height="10" rx="2" fill="#3B82F6" opacity="0.6"/>
    <rect x="18" y="47" width="10" height="10" rx="2" fill="#3B82F6" opacity="0.6"/>
    <rect x="42" y="47" width="10" height="10" rx="2" fill="#3B82F6" opacity="0.6"/>
    
    <!-- Center dot -->
    <circle cx="35" cy="40" r="8" fill="#F59E0B"/>
    <circle cx="35" cy="40" r="4" fill="#1E3A8A"/>
    
    <!-- Signal waves (RFID radio waves) -->
    <path d="M 68 30 Q 75 40 68 50" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 72 25 Q 82 40 72 55" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 76 20 Q 89 40 76 60" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.4"/>
  </g>
  
  <!-- ATZ RFID Text -->
  <text x="90" y="52" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="32" fill="url(#textGradient)">
    ATZ RFID
  </text>
  
  <!-- Tagline (optional) -->
  <text x="90" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="normal" font-size="11" fill="#64748B" letter-spacing="2">
    PREMIUM RFID SOLUTIONS
  </text>
</svg>